moveit_servo:

  use_gazebo: false

  command_in_type: "speed_units"

  cartesian_command_in_topic: /teleop_twist
  joint_command_in_topic: /servo_node/delta_joint_node 

  robot_link_command_frame: g_base

  move_group_name: arm_group
  planning_group: g_base
  ee_frame_name: joint6_flange

  joint_topic: /joint_states

  # output topic and type
  command_out_topic: /arm_group_controller/joint_trajectory
  command_out_type: trajectory_msgs/JointTrajectory

  # publish config
  publish_joint_positions: true
  publish_joint_velocities: false
  publish_joint_acceleration: false

  # timing handling
  publish_period: 0.02
  incoming_command_timeout: 0.1
  num_outgoing_halt_msgs_to_publish: 4

  # singularity and joint-limit handling
  lower_singularity_threshold: 17.0
  hard_stop_singularity_threshold: 30.0
  joint_limit_margin: 0.1

  # collision handling
  check_collison: true
  collision_check_rate: 10.0
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
